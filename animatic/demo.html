<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ITSGOK — Démo de la couche d'animation</title>
<link rel="stylesheet" href="motion.css" />
<style>
/* =========================================================================
   Démo autonome : mêmes 24 scènes, même structure DOM que l'animatic
   (#stage > .scene.<type>), mais décors et personnages dessinés en CSS
   pour ne dépendre d'aucune image. Les textes sont des placeholders.
   ========================================================================= */
:root{
  --bg:#07080b; --panel:#101217; --text:#f5f2ea; --muted:#b4b5bd;
  --gold:#ffb000; --violet:#8b5cf6; --blue:#38bdf8; --red:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center; gap:14px; padding:18px;
}
header{width:100%;max-width:1080px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:.14em;text-transform:uppercase}
h1 b{color:var(--gold)}
.hint{color:var(--muted);font-size:13px}

#stage{
  position:relative; width:100%; max-width:1080px; aspect-ratio:16/9;
  background:#000; border-radius:16px; overflow:hidden; isolation:isolate;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
}
#stage::after{ /* vignette */
  content:''; position:absolute; inset:0; pointer-events:none; z-index:57;
  background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%);
}

/* --- structure de scène identique à l'animatic d'origine --------------- */
.scene{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .75s ease;
}
.scene.active{opacity:1; pointer-events:auto}

.bg{position:absolute; inset:0}

/* =========================== DÉCORS ==================================== */
.set-living{background:
  radial-gradient(ellipse at 50% 110%, #2a2318 0%, transparent 60%),
  linear-gradient(#1b1f2b 0%, #14161f 55%, #0d0f15 100%);}
.set-living::before{content:'';position:absolute;left:8%;right:8%;bottom:0;height:34%;
  background:linear-gradient(#3a2a22,#241a15);border-radius:26px 26px 0 0;
  box-shadow:inset 0 8px 0 rgba(255,255,255,.05);}
.set-hall{background:
  linear-gradient(#171b26 0%,#0f121a 100%);}
.set-hall::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 3px, transparent 3px 140px);}
.set-bath{background:
  radial-gradient(ellipse at 50% 20%, #2b3a44 0%, transparent 65%),
  linear-gradient(#18222a,#0e1318);}
.set-bath::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 90px),
             repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 90px);}
.set-door{background:radial-gradient(ellipse at 50% 50%, #1d222d 0%, #08090d 70%);}
.set-setup{background:
  radial-gradient(ellipse at 50% 60%, rgba(139,92,246,.35) 0%, transparent 58%),
  radial-gradient(ellipse at 15% 30%, rgba(56,189,248,.28) 0%, transparent 52%),
  linear-gradient(#12111c,#07080d);}
.set-epic{background:
  radial-gradient(ellipse at 50% 55%, rgba(255,176,0,.4) 0%, transparent 62%),
  linear-gradient(#150f06,#07080b);}
.set-epic::before{content:'';position:absolute;inset:-30%;
  background:repeating-conic-gradient(from 0deg at 50% 50%,
    rgba(255,214,140,.15) 0deg 5deg, transparent 5deg 16deg);
  animation:rays 26s linear infinite;}
@keyframes rays{to{transform:rotate(360deg)}}
.set-final{background:
  radial-gradient(ellipse at 50% 50%, rgba(255,176,0,.28) 0%, transparent 60%),
  linear-gradient(#0b0a08,#050506);}

/* =========================== ACCESSOIRES =============================== */
.prop{position:absolute}
.sofa{left:16%;right:16%;bottom:14%;height:22%;
  background:linear-gradient(#3d2f4d,#241c30);border-radius:22px;
  box-shadow:0 18px 40px rgba(0,0,0,.6), inset 0 6px 0 rgba(255,255,255,.06);}
.phone{left:50%;top:38%;width:56px;height:100px;margin-left:-28px;border-radius:10px;
  background:#0b0d12;border:2px solid #333a49;
  box-shadow:0 0 0 3px rgba(56,189,248,.25), 0 0 40px rgba(56,189,248,.5);
  animation:vibe .12s linear infinite;}
.phone::after{content:'';position:absolute;inset:5px;border-radius:6px;
  background:linear-gradient(#123047,#0a1a26);}
@keyframes vibe{0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(2px,-2px) rotate(2deg)}75%{transform:translate(-2px,2px) rotate(-2deg)}}
.heart{left:50%;top:30%;width:44px;height:44px;margin-left:-22px;
  background:var(--red);transform:rotate(45deg);animation:heartpop 1.6s ease-in-out infinite;}
.heart::before,.heart::after{content:'';position:absolute;width:44px;height:44px;
  background:var(--red);border-radius:50%;}
.heart::before{left:-22px}.heart::after{top:-22px}
@keyframes heartpop{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.22)}}
.doorframe{left:50%;top:12%;width:26%;bottom:12%;margin-left:-13%;
  background:linear-gradient(#3a2f26,#1d1712);border-radius:6px;
  box-shadow:0 0 60px rgba(0,0,0,.7), inset 0 0 0 4px rgba(255,255,255,.06);}
.doorknob{left:50%;top:52%;width:16px;height:16px;margin-left:8%;border-radius:50%;
  background:var(--gold);box-shadow:0 0 22px rgba(255,176,0,.8);
  animation:knob 2.4s ease-in-out infinite;}
@keyframes knob{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-22deg)}90%{transform:rotate(6deg)}}
.mirror{left:50%;top:14%;width:30%;height:48%;margin-left:-15%;border-radius:10px;
  background:linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.03));
  border:3px solid #2b3540;}
.mirror::after{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shine 4.5s ease-in-out infinite;}
@keyframes shine{0%{left:-40%}60%,100%{left:120%}}
.spray{left:50%;top:44%;width:10px;height:10px;margin-left:60px;border-radius:50%;
  background:rgba(255,255,255,.55);box-shadow:0 0 30px rgba(255,255,255,.4);
  animation:mist 2.2s ease-out infinite;}
@keyframes mist{0%{transform:scale(.4);opacity:.9}100%{transform:scale(9);opacity:0}}
.desk{left:26%;right:26%;bottom:18%;height:8%;background:linear-gradient(#20222c,#121419);
  border-radius:6px;box-shadow:0 16px 34px rgba(0,0,0,.6);}
.screen{left:32%;right:32%;bottom:26%;height:34%;border-radius:8px;
  background:linear-gradient(#0e2233,#07131c);border:3px solid #232a36;
  box-shadow:0 0 70px rgba(56,189,248,.45);}
.screen::after{content:'';position:absolute;inset:6px;border-radius:4px;
  background:repeating-linear-gradient(0deg, rgba(56,189,248,.18) 0 2px, transparent 2px 6px);
  animation:scan 3s linear infinite;}
@keyframes scan{to{background-position:0 60px}}
.rgb{left:12%;right:12%;top:10%;height:6px;border-radius:4px;
  background:linear-gradient(90deg,#ef4444,#ffb000,#22c55e,#38bdf8,#8b5cf6,#ef4444);
  background-size:300% 100%;animation:rgbawake 4s linear infinite;filter:blur(1px);}
@keyframes rgbawake{to{background-position:300% 0}}
.halo{left:50%;top:16%;width:34%;padding-top:34%;margin-left:-17%;border-radius:50%;
  background:radial-gradient(circle, rgba(255,176,0,.55) 0%, transparent 68%);
  animation:pray 3.4s ease-in-out infinite;}
@keyframes pray{0%,100%{transform:scale(.94);opacity:.7}50%{transform:scale(1.1);opacity:1}}
.powerbtn{left:50%;bottom:20%;width:66px;height:66px;margin-left:-33px;border-radius:50%;
  border:4px solid var(--gold);animation:powerPulse 1.5s ease-in-out infinite;}
.powerbtn::after{content:'';position:absolute;left:50%;top:12px;width:4px;height:24px;
  margin-left:-2px;background:var(--gold);}
@keyframes powerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,176,0,.6)}
  70%{box-shadow:0 0 0 26px rgba(255,176,0,0)}}
.logo{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:900;
  letter-spacing:.3em;font-size:clamp(28px,6vw,72px);color:var(--gold);
  text-shadow:0 0 40px rgba(255,176,0,.6);}
.logo small{display:block;font-size:.28em;letter-spacing:.5em;color:var(--text);margin-top:10px}
.chest{left:50%;bottom:16%;width:120px;height:80px;margin-left:-60px;border-radius:8px;
  background:linear-gradient(#c9a227,#8a6d10);box-shadow:0 0 50px rgba(255,176,0,.5);}

/* =========================== PERSONNAGES =============================== */
/* Racine (.gokCard/.cindyCard) : reçoit pop/respiration/parole via motion.js
   .rigX  : déplacement horizontal      .figure : penché / rebond
   Les membres sont animés indépendamment (marche, course, geste).        */
.puppet{position:absolute;bottom:14%;width:130px;height:230px}
.puppet .rigX{position:absolute;inset:0}
.puppet .figure{position:absolute;inset:0;transform-origin:50% 100%}
.puppet .head{position:absolute;left:50%;top:0;width:62px;height:62px;margin-left:-31px;
  border-radius:50%;background:var(--skin);box-shadow:inset -6px -6px 0 rgba(0,0,0,.12)}
.puppet .hair{position:absolute;left:50%;top:-8px;width:74px;height:44px;margin-left:-37px;
  border-radius:38px 38px 12px 12px;background:var(--hair)}
.puppet .eye{position:absolute;top:30px;width:7px;height:7px;border-radius:50%;background:#14161d;
  animation:blink 5.4s infinite}
.puppet .eye.l{left:calc(50% - 16px)} .puppet .eye.r{left:calc(50% + 9px)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.puppet .mouth{position:absolute;left:50%;top:46px;width:18px;height:5px;margin-left:-9px;
  border-radius:0 0 10px 10px;background:#20141a}
.puppet .torso{position:absolute;left:50%;top:66px;width:82px;height:96px;margin-left:-41px;
  border-radius:22px 22px 14px 14px;background:var(--fit)}
.puppet .arm{position:absolute;top:76px;width:16px;height:82px;border-radius:10px;
  background:var(--fit);transform-origin:50% 8px}
.puppet .arm.l{left:calc(50% - 52px)} .puppet .arm.r{left:calc(50% + 36px)}
.puppet .leg{position:absolute;top:158px;width:20px;height:76px;border-radius:10px;
  background:var(--pants);transform-origin:50% 6px}
.puppet .leg.l{left:calc(50% - 26px)} .puppet .leg.r{left:calc(50% + 6px)}

.gok  {--skin:#d9a07a;--hair:#20160f;--fit:#1f2937;--pants:#111827}
.cindy{--skin:#e8b894;--hair:#4a2318;--fit:#7c2d4a;--pants:#2a1520}

/* Idle : balancement des bras, très léger */
.puppet .arm{animation:idleArm 3.8s ease-in-out infinite alternate}
.puppet .arm.r{animation-delay:-1.9s}
@keyframes idleArm{from{transform:rotate(4deg)}to{transform:rotate(-6deg)}}

/* Assis (canapé, chaise gaming) */
.puppet.sitting .leg{height:52px;transform:rotate(72deg);animation:none;border-radius:10px}
.puppet.sitting .figure{transform:translateY(38px)}
.puppet.sitting .arm{animation-duration:5.6s}

/* Marche */
.puppet.walk .leg  {animation:walkLeg .62s ease-in-out infinite alternate}
.puppet.walk .leg.r{animation-delay:-.31s}
.puppet.walk .arm  {animation:walkArm .62s ease-in-out infinite alternate}
.puppet.walk .arm.r{animation-delay:-.31s}
.puppet.walk .figure{animation:bob .31s ease-in-out infinite alternate}
@keyframes walkLeg{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes walkArm{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}

/* Course */
.puppet.run .leg  {animation:runLeg .3s ease-in-out infinite alternate}
.puppet.run .leg.r{animation-delay:-.15s}
.puppet.run .arm  {animation:runArm .3s ease-in-out infinite alternate}
.puppet.run .arm.r{animation-delay:-.15s}
.puppet.run .figure{animation:runBob .15s ease-in-out infinite alternate;transform:rotate(-8deg)}
@keyframes runLeg{from{transform:rotate(52deg)}to{transform:rotate(-52deg)}}
@keyframes runArm{from{transform:rotate(-64deg)}to{transform:rotate(58deg)}}
@keyframes runBob{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(-8deg) translateY(-11px)}}

/* Traversée de l'écran */
.puppet.crossR .rigX{animation:crossR 4.2s linear infinite}
.puppet.crossL .rigX{animation:crossL 4.2s linear infinite}
@keyframes crossR{from{transform:translateX(-46vw)}to{transform:translateX(46vw)}}
@keyframes crossL{from{transform:translateX(46vw) scaleX(-1)}to{transform:translateX(-46vw) scaleX(-1)}}

/* Bras levés (champion, prière, victoire) */
.puppet.cheer .arm{animation:cheer 1.1s ease-in-out infinite alternate}
@keyframes cheer{from{transform:rotate(158deg)}to{transform:rotate(178deg)}}
.puppet.pray .arm.l{transform:rotate(48deg);animation:none}
.puppet.pray .arm.r{transform:rotate(-48deg);animation:none}

/* Panique */
.puppet.panic .figure{animation:panicShake .16s linear infinite}
.puppet.panic .arm{animation:cheer .22s ease-in-out infinite alternate}
@keyframes panicShake{0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-4px,-2px) rotate(-3deg)}75%{transform:translate(4px,2px) rotate(3deg)}}

/* Position dans le cadre */
.at-left  {left:16%} .at-right{right:16%;left:auto} .at-center{left:50%;margin-left:-65px}
.far{transform:scale(.72);filter:brightness(.8)}

/* =========================== TEXTES ==================================== */
.meta{position:absolute;left:0;right:0;bottom:0;padding:18px 22px 22px;z-index:40;
  background:linear-gradient(transparent,rgba(4,5,8,.88) 55%)}
.meta h2{margin:0 0 4px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.meta p{margin:0;font-size:13px;color:var(--muted);max-width:70ch}
#dialogue{position:absolute;left:0;right:0;bottom:78px;text-align:center;z-index:45;padding:0 24px}
#dialogue .who{display:inline-block;font-size:11px;letter-spacing:.24em;padding:3px 10px;
  border-radius:999px;background:rgba(255,176,0,.18);color:var(--gold);margin-bottom:6px}
#dialogue .who.CINDY{background:rgba(236,72,153,.2);color:#f9a8d4}
#dialogue .txt{font-size:clamp(15px,2vw,22px);font-weight:600;
  text-shadow:0 2px 18px rgba(0,0,0,.9);max-width:44ch;margin:0 auto}
#dialogue.show{animation:lineIn .4s ease both}
@keyframes lineIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* =========================== CONTRÔLES ================================= */
.controls{width:100%;max-width:1080px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--panel);padding:12px 14px;border-radius:12px}
button,select{background:#1b1e26;color:var(--text);border:1px solid #2b303c;border-radius:8px;
  padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--gold)}
.track{flex:1;min-width:180px;height:8px;border-radius:99px;background:#23262f;cursor:pointer;position:relative}
#bar{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--violet))}
#time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
@media(max-width:800px){ .puppet{width:96px;height:170px} .meta p{display:none} }
</style>
</head>
<body>

<header>
  <h1><b>ITSGOK</b> — démo couche d'animation</h1>
  <span class="hint">Décors et personnages dessinés en CSS, textes de démonstration : seule la mise en mouvement est représentative.</span>
</header>

<div id="stage"></div>

<div class="controls">
  <button id="play">▶ Lecture</button>
  <button id="restart">↺</button>
  <div class="track" id="track"><div id="bar"></div></div>
  <span id="time">0:00 / 0:00</span>
  <select id="speed">
    <option value="1">1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
  </select>
  <label class="chk"><input type="checkbox" id="tts" /> Voix</label>
</div>

<script>
/* =========================================================================
   Données de scènes : mêmes types et même ordre que l'animatic.
   Titres, légendes et répliques sont des placeholders de démonstration.
   ========================================================================= */
const SCENES = [
 {type:'living',   dur:10, title:'Soirée tranquille', caption:'Gok et Cindy sur le canapé, détendus.',
  dialogue:[['CINDY',"Tu sais qu'elle va être complètement gâtée, notre fille ?",1],['GOK',"Par toi surtout. Moi je serai raisonnable.",4.6],['CINDY',"Toi ? Raisonnable ?",8]]},
 {type:'living',   dur:9,  title:'Les projets', caption:'La conversation part sur l\'avenir.',
  dialogue:[['GOK',"On aura le temps de tout préparer.",1],['CINDY',"On a surtout intérêt.",5]]},
 {type:'phone',    dur:8,  title:'Le téléphone vibre', caption:'Une alerte coupe la soirée net.',
  dialogue:[['GOK',"Attends… c'est l'heure du stream.",1.5]]},
 {type:'panic',    dur:8,  title:'Panique', caption:'Gok réalise qu\'il est en retard.',
  dialogue:[['GOK',"NON NON NON, je suis à la bourre !",1]]},
 {type:'kiss',     dur:7,  title:'Le bisou', caption:'Départ précipité mais pas impoli.',
  dialogue:[['CINDY',"Vas-y, je gère.",1.4],['GOK',"Je t'aime !",4]]},
 {type:'corridor', dur:7,  title:'Course dans le couloir', caption:'Sprint jusqu\'à la salle de bain.',
  dialogue:[['GOK',"Quatre minutes. QUATRE.",1.2]]},
 {type:'door',     dur:6,  title:'La porte', caption:'Freinage devant la porte.',
  dialogue:[['GOK',"Occupé ?!",1.2]]},
 {type:'toilet',   dur:7,  title:'Pause obligatoire', caption:'Il faut bien.',
  dialogue:[['GOK',"C'est vraiment le moment…",1.5]]},
 {type:'champion', dur:6,  title:'Sortie triomphale', caption:'Mission accomplie.',
  dialogue:[['GOK',"On enchaîne !",1]]},
 {type:'bathroom', dur:8,  title:'Salle de bain', caption:'Face au miroir, l\'heure des choix.',
  dialogue:[['GOK',"Bon. On a l'air de quoi, là ?",1.4]]},
 {type:'hair',     dur:7,  title:'Les cheveux', caption:'Bataille perdue d\'avance.',
  dialogue:[['GOK',"Elles font ce qu'elles veulent, ces mèches.",1.3]]},
 {type:'perfume',  dur:6,  title:'Le parfum', caption:'Deux pressions. Trois. Quatre.',
  dialogue:[['GOK',"On sent bon, c'est l'essentiel.",1.2]]},
 {type:'ready',    dur:6,  title:'Prêt', caption:'Le regard change.',
  dialogue:[['GOK',"Là, on est bien.",1]]},
 {type:'epic',     dur:7,  title:'Marche héroïque', caption:'Retour vers le setup, au ralenti.',
  dialogue:[['GOK',"C'est l'heure.",2]]},
 {type:'handle',   dur:5,  title:'La poignée', caption:'La main se pose sur la porte du studio.',
  dialogue:[]},
 {type:'gaming',   dur:8,  title:'Le repaire', caption:'La pièce s\'allume.',
  dialogue:[['GOK',"Ma maison.",1.4]]},
 {type:'setup',    dur:8,  title:'Le setup', caption:'Écrans, néons, tout est en place.',
  dialogue:[['GOK',"Tout est prêt.",1.6]]},
 {type:'prayer',   dur:7,  title:'La petite prière', caption:'Rituel avant chaque live.',
  dialogue:[['GOK',"Faites que le chat soit sage.",1.4]]},
 {type:'power',    dur:6,  title:'Allumage', caption:'Le doigt sur le bouton.',
  dialogue:[]},
 {type:'awake',    dur:7,  title:'Réveil du RGB', caption:'La machine respire.',
  dialogue:[['GOK',"Voilà.",2]]},
 {type:'sit',      dur:6,  title:'Il s\'assoit', caption:'Le fauteuil accueille son propriétaire.',
  dialogue:[['GOK',"On y va.",1.5]]},
 {type:'cindydoor',dur:7,  title:'Cindy passe la tête', caption:'Un dernier mot avant le direct.',
  dialogue:[['CINDY',"Bon stream, mon amour.",1.2],['GOK',"Merci bébé.",4.2]]},
 {type:'launch',   dur:7,  title:'Lancement', caption:'Le live démarre.',
  dialogue:[['GOK',"Bonsoir tout le monde !",1.6]]},
 {type:'final',    dur:8,  title:'Bienvenue à la maison', caption:'Logo final.',
  dialogue:[['GOK',"Welcome home.",2.2]]}
];
const TOTAL = SCENES.reduce((a,s)=>a+s.dur,0);

/* ============================ CONSTRUCTION ============================== */
function puppet(who, cls, pos){
  return `<div class="${who==='GOK'?'gokCard':'cindyCard'} puppet ${who==='GOK'?'gok':'cindy'} ${cls||''} ${pos||'at-center'}">
    <div class="rigX"><div class="figure">
      <div class="hair"></div><div class="head"></div>
      <div class="eye l"></div><div class="eye r"></div><div class="mouth"></div>
      <div class="torso"></div>
      <div class="arm l"></div><div class="arm r"></div>
      <div class="leg l"></div><div class="leg r"></div>
    </div></div></div>`;
}

/* Décor + accessoires + distribution, par type de scène. */
const SETS = {
  living:   ()=>`<div class="bg set-living"></div><div class="prop sofa"></div>
                 ${puppet('GOK','sitting','at-left')}${puppet('CINDY','sitting','at-right')}`,
  phone:    ()=>`<div class="bg set-living"></div><div class="prop sofa"></div><div class="prop phone"></div>
                 ${puppet('GOK','sitting','at-left')}${puppet('CINDY','sitting','at-right')}`,
  panic:    ()=>`<div class="bg set-living"></div><div class="prop sofa"></div>
                 ${puppet('GOK','panic','at-center')}${puppet('CINDY','sitting far','at-right')}`,
  kiss:     ()=>`<div class="bg set-living"></div><div class="prop heart"></div>
                 ${puppet('GOK','','at-left')}${puppet('CINDY','','at-right')}`,
  corridor: ()=>`<div class="bg set-hall"></div>${puppet('GOK','run crossR','at-center')}`,
  door:     ()=>`<div class="bg set-door"></div><div class="prop doorframe"></div><div class="prop doorknob"></div>
                 ${puppet('GOK','','at-left')}`,
  toilet:   ()=>`<div class="bg set-bath"></div><div class="prop doorframe"></div>`,
  champion: ()=>`<div class="bg set-epic"></div>${puppet('GOK','cheer','at-center')}`,
  bathroom: ()=>`<div class="bg set-bath"></div><div class="prop mirror"></div>${puppet('GOK','','at-center')}`,
  hair:     ()=>`<div class="bg set-bath"></div><div class="prop mirror"></div>${puppet('GOK','cheer','at-center')}`,
  perfume:  ()=>`<div class="bg set-bath"></div><div class="prop spray"></div>${puppet('GOK','','at-center')}`,
  ready:    ()=>`<div class="bg set-bath"></div><div class="prop mirror"></div>${puppet('GOK','','at-center')}`,
  epic:     ()=>`<div class="bg set-epic"></div>${puppet('GOK','walk crossR','at-center')}`,
  handle:   ()=>`<div class="bg set-door"></div><div class="prop doorframe"></div><div class="prop doorknob"></div>
                 ${puppet('GOK','','at-left')}`,
  gaming:   ()=>`<div class="bg set-setup"></div><div class="prop rgb"></div><div class="prop desk"></div>
                 ${puppet('GOK','walk','at-left')}`,
  setup:    ()=>`<div class="bg set-setup"></div><div class="prop rgb"></div><div class="prop screen"></div>
                 <div class="prop desk"></div>${puppet('GOK','','at-left')}`,
  prayer:   ()=>`<div class="bg set-setup"></div><div class="prop halo"></div>${puppet('GOK','pray','at-center')}`,
  power:    ()=>`<div class="bg set-setup"></div><div class="prop powerbtn"></div>${puppet('GOK','','at-left')}`,
  awake:    ()=>`<div class="bg set-setup"></div><div class="prop rgb"></div><div class="prop screen"></div>
                 <div class="prop desk"></div>${puppet('GOK','','at-left')}`,
  sit:      ()=>`<div class="bg set-setup"></div><div class="prop rgb"></div><div class="prop screen"></div>
                 <div class="prop desk"></div>${puppet('GOK','sitting','at-center')}`,
  cindydoor:()=>`<div class="bg set-setup"></div><div class="prop screen"></div><div class="prop desk"></div>
                 ${puppet('GOK','sitting','at-left')}${puppet('CINDY','','at-right')}`,
  launch:   ()=>`<div class="bg set-setup"></div><div class="prop rgb"></div><div class="prop screen"></div>
                 <div class="prop desk"></div>${puppet('GOK','sitting cheer','at-center')}`,
  final:    ()=>`<div class="bg set-final"></div><div class="prop chest"></div>
                 <div class="prop logo">ITSGOK<small>WELCOME HOME</small></div>`
};

const stage = document.getElementById('stage');
SCENES.forEach((s,i)=>{
  const build = SETS[s.type] || (()=>`<div class="bg set-door"></div>`);
  stage.insertAdjacentHTML('beforeend',
    `<section class="scene ${s.type}" id="scene-${i}" data-type="${s.type}">
       ${build()}
       <div class="meta"><h2>${i+1}. ${s.title}</h2><p>${s.caption}</p></div>
     </section>`);
});
stage.insertAdjacentHTML('beforeend','<div id="dialogue"></div>');

/* ============================== MOTEUR ================================== */
const playBtn=document.getElementById('play'), bar=document.getElementById('bar'),
      timeEl=document.getElementById('time'), speedSel=document.getElementById('speed'),
      track=document.getElementById('track'), dlg=document.getElementById('dialogue'),
      ttsChk=document.getElementById('tts');
let current=0, playing=false, lastTs=null, activeIdx=-1;
const spokenKeys=new Set();

function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}
function sceneAt(t){let acc=0;for(let i=0;i<SCENES.length;i++){if(t<acc+SCENES[i].dur)return[i,t-acc];acc+=SCENES[i].dur;}return[SCENES.length-1,SCENES[SCENES.length-1].dur];}

function enterScene(i){
  if(i===activeIdx) return;
  activeIdx=i;
  stage.querySelectorAll('.scene').forEach((el,k)=>el.classList.toggle('active',k===i));
  dlg.innerHTML=''; dlg.classList.remove('show');
  whoosh();
}
function showDialogue(who,text){
  dlg.innerHTML=`<div class="who ${who}">${who}</div><div class="txt">${text}</div>`;
  dlg.classList.remove('show'); void dlg.offsetWidth; dlg.classList.add('show');
}
function speak(who,text){
  if(!ttsChk.checked || !('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='fr-FR'; u.rate=1.02; u.pitch=who==='CINDY'?1.35:0.85;
  speechSynthesis.speak(u);
}
let ac=null;
function whoosh(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(420,ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(90,ac.currentTime+.28);
    g.gain.setValueAtTime(.05,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.3);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.3);
  }catch(e){}
}

function update(ts){
  if(!playing) return;
  if(lastTs==null) lastTs=ts;
  const speed=parseFloat(speedSel.value)||1;
  current+=(ts-lastTs)/1000*speed; lastTs=ts;
  if(current>=TOTAL){current=TOTAL;playing=false;playBtn.textContent='▶ Lecture';speechSynthesis.cancel();}
  const [i,local]=sceneAt(current);
  enterScene(i);
  SCENES[i].dialogue.forEach((d,idx)=>{
    const key=i+':'+idx;
    if(local>=d[2] && !spokenKeys.has(key)){ spokenKeys.add(key); showDialogue(d[0],d[1]); speak(d[0],d[1]); }
  });
  timeEl.textContent=fmt(current)+' / '+fmt(TOTAL);
  bar.style.width=(current/TOTAL*100)+'%';
  if(playing) requestAnimationFrame(update);
}

playBtn.addEventListener('click',()=>{
  playing=!playing; lastTs=null;
  playBtn.textContent=playing?'❚❚ Pause':'▶ Lecture';
  if(playing) requestAnimationFrame(update); else speechSynthesis.cancel();
});
document.getElementById('restart').addEventListener('click',()=>{
  current=0; activeIdx=-1; spokenKeys.clear(); speechSynthesis.cancel();
  enterScene(0); bar.style.width='0%'; timeEl.textContent=fmt(0)+' / '+fmt(TOTAL);
});
track.addEventListener('click',e=>{
  const r=track.getBoundingClientRect();
  current=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL;
  const [i]=sceneAt(current);
  spokenKeys.clear(); speechSynthesis.cancel();
  activeIdx=-1; enterScene(i);
  bar.style.width=(current/TOTAL*100)+'%'; timeEl.textContent=fmt(current)+' / '+fmt(TOTAL);
});

timeEl.textContent=fmt(0)+' / '+fmt(TOTAL);
enterScene(0);
</script>
<script src="motion.js"></script>
</body>
</html>
