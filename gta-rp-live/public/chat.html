<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Chat TikTok live</title>
  <link rel="stylesheet" href="/control.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center; }
    .bar button, .bar select { padding: 6px 10px; font-size: 12px; width: auto; }
    .bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
    .bar .spacer { flex: 1; }
    #list { flex: 1; overflow-y: auto; padding: 8px 10px 20px; display: flex; flex-direction: column; gap: 6px; }
    .msg { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; background: var(--panel); border-radius: 10px; border: 1px solid transparent; font-size: var(--size, 15px); }
    .msg .who { font-weight: 800; color: var(--cyan); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
    .msg .txt { flex: 1; overflow-wrap: anywhere; }
    .msg .act { opacity: 0; padding: 2px 8px; font-size: 13px; width: auto; }
    .msg:hover .act, .msg:focus-within .act { opacity: 1; }
    @media (hover: none) { .msg .act { opacity: .7; } }
    .msg.question { border-color: var(--warn); }
    .msg.question .who::after { content: ' ❓'; }
    .msg.mention { border-color: var(--accent); background: rgba(255, 45, 111, .1); }
    .msg.event { background: transparent; color: var(--muted); font-size: 13px; justify-content: center; }
    .empty { margin: auto; color: var(--muted); text-align: center; padding: 20px; max-width: 320px; }
    #more { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; }
    #more.show { display: block; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="chip" id="tt-chip">TikTok</span>
    <button id="tts" aria-pressed="false" title="Lire les messages à voix haute (tu entends le chat sans quitter le jeu des yeux)">🔊 Lecture vocale</button>
    <button id="questions" aria-pressed="false" title="N'afficher que les questions">❓ Questions</button>
    <select id="size" aria-label="Taille du texte">
      <option value="14px">Petit</option>
      <option value="16px" selected>Moyen</option>
      <option value="20px">Grand</option>
      <option value="26px">Très grand</option>
    </select>
    <span class="spacer"></span>
    <button id="test" class="ghost" title="Envoyer un message de test">Test</button>
  </div>
  <div id="list"><p class="empty" id="empty">Les messages du live TikTok apparaîtront ici.<br /><br />Connecte ton pseudo TikTok dans la télécommande, puis clique sur 📌 à côté d’un message pour l’afficher à l’écran.</p></div>
  <button id="more">⬇ Nouveaux messages</button>

  <script src="/common.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
