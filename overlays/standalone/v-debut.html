<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Début — ItsGokTV</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap');
/* ============================================================
   ItsGokTV — identité rouge / noir, déclinée en vertical 9:16
   Reprend la direction artistique des overlays Twitch existants :
   obliques animées, typo condensée massive, coins entaillés.
   ============================================================ */



:root {
  --ink:      #0A0406;
  --ink-2:    #16070A;
  --red-900:  #4A0A11;
  --red-700:  #8E1119;
  --red-600:  #B81625;
  --red-500:  #D91F35;
  --red-400:  #F03B52;
  --hot:      #FF5C74;
  --white:    #FFFFFF;
  --dim:      rgba(255, 255, 255, 0.62);

  /* Titres : condensée lourde, comme sur tes écrans Twitch */
  --display: "Anton", "Haettenschweiler", "Arial Narrow Bold", Impact, sans-serif;
  /* Texte courant et étiquettes */
  --ui: "Barlow Condensed", "Segoe UI", system-ui, sans-serif;

  /* Zone exploitable TikTok en 1080x1920 */
  --safe-top: 250px;
  --safe-bottom: 1420px;
  --safe-right: 880px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1080px; height: 1920px;
  overflow: hidden;
  background: var(--ink);
  color: var(--white);
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   FOND — dégradé noir → rouge en diagonale + obliques animées
   ============================================================ */

.stage { position: absolute; inset: 0; overflow: hidden; }

/* Le dégradé de base : noir en bas à gauche, rouge en haut à droite */
.base {
  position: absolute; inset: -10%;
  background:
    radial-gradient(120% 90% at 100% 0%, var(--red-500) 0%, var(--red-700) 32%, transparent 68%),
    radial-gradient(90% 80% at 85% 35%, var(--red-600) 0%, transparent 60%),
    linear-gradient(145deg, var(--ink) 0%, var(--ink-2) 38%, var(--red-900) 100%);
}

/* Les obliques : chaque barre est un div incliné, animé en translation.
   Uniquement transform → GPU, coût CPU quasi nul. */
.streaks { position: absolute; inset: -30%; transform: rotate(-24deg); }
.streak {
  position: absolute;
  top: -20%;
  height: 140%;
  border-radius: 999px;
  animation: slide 26s linear infinite;
  will-change: transform;
}
/* Barres claires */
.streak.lite {
  background: linear-gradient(180deg,
    transparent, rgba(255, 92, 116, .55) 22%, rgba(255, 92, 116, .75) 55%, transparent);
  box-shadow: 0 0 60px rgba(255, 60, 90, .45);
}
/* Barres sombres — creusent le fond, effet de profondeur */
.streak.dark {
  background: linear-gradient(180deg,
    transparent, rgba(10, 4, 6, .75) 25%, rgba(10, 4, 6, .9) 60%, transparent);
}

@keyframes slide {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(0, -320px, 0); }
}

/* Voile sombre en bas : garde le texte lisible sous les commentaires TikTok */
.vignette {
  position: absolute; inset: 0;
  background:
    linear-gradient(to top, rgba(6, 2, 3, .92) 0%, transparent 34%),
    radial-gradient(120% 70% at 50% 45%, transparent 40%, rgba(6, 2, 3, .55) 100%);
}

/* ============================================================
   TYPOGRAPHIE
   ============================================================ */

.kicker {
  font-family: var(--ui);
  font-size: 40px; font-weight: 600;
  letter-spacing: .58em; text-transform: uppercase;
  text-indent: .58em;              /* compense le tracking, recentre */
  color: var(--white);
  opacity: .92;
}

.display {
  font-family: var(--display);
  font-size: 168px;
  line-height: .88;
  letter-spacing: .005em;
  text-transform: uppercase;
  text-shadow: 0 10px 44px rgba(0, 0, 0, .75);
}
.display.sm { font-size: 128px; }

.center {
  position: absolute; left: 0; right: 0;
  text-align: center; padding: 0 60px;
}

.sub {
  font-size: 38px; font-weight: 500;
  color: var(--dim);
  letter-spacing: .01em;
}

/* ============================================================
   CADRES À COINS ENTAILLÉS — signature de tes overlays Twitch
   ============================================================ */

.notch {
  position: absolute;
  --cut: 26px;
  clip-path: polygon(
    var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
    calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
  );
  background: linear-gradient(135deg, var(--red-400), var(--red-600) 45%, var(--red-700));
  padding: 5px;
}
.notch > .inner {
  width: 100%; height: 100%;
  --cut: 22px;
  clip-path: polygon(
    var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
    calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
  );
  background: rgba(6, 2, 3, .55);
}

/* Griffures d'angle */
.claw { position: absolute; width: 90px; height: 70px; pointer-events: none; }
.claw i {
  position: absolute; height: 5px; border-radius: 3px;
  background: var(--hot);
  transform: rotate(-24deg);
  box-shadow: 0 0 14px rgba(255, 92, 116, .8);
}
.claw i:nth-child(1) { width: 60px; top: 10px; left: 0; }
.claw i:nth-child(2) { width: 38px; top: 30px; left: 12px; opacity: .8; }
.claw i:nth-child(3) { width: 22px; top: 50px; left: 24px; opacity: .55; }

/* ============================================================
   BANDEAU LIVE
   ============================================================ */

.topbar {
  position: absolute; top: 96px; left: 46px;
  display: flex; align-items: center; gap: 20px;
}
.handle {
  font-family: var(--display);
  font-size: 54px; text-transform: uppercase;
  letter-spacing: .01em;
  text-shadow: 0 6px 26px rgba(0, 0, 0, .8);
}
.live {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 22px 10px 18px;
  background: linear-gradient(120deg, var(--red-500), var(--red-700));
  font-family: var(--ui);
  font-size: 30px; font-weight: 700; letter-spacing: .22em;
  --cut: 12px;
  clip-path: polygon(
    var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
    calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
  );
}
.live .pip {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--white);
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .2 } }

/* ============================================================
   PANNEAUX « DERNIER … » — repris de tes overlays Twitch
   ============================================================ */

.panels { display: flex; flex-direction: column; gap: 16px; }

.panel {
  position: relative;
  display: flex; align-items: center; gap: 18px;
  height: 92px; padding: 0 26px;
  background: linear-gradient(105deg, var(--red-600) 0%, var(--red-700) 55%, var(--red-900) 100%);
  overflow: hidden;
  --cut: 16px;
  clip-path: polygon(
    var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
    calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
  );
}
/* Texture d'obliques à l'intérieur du panneau */
.panel::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -24deg,
    transparent 0 26px,
    rgba(255, 255, 255, .07) 26px 34px,
    transparent 34px 70px
  );
}
.panel .ico { width: 40px; flex: 0 0 40px; z-index: 1; }
.panel .ico svg { width: 100%; height: auto; fill: var(--white); display: block; }
.panel .lbl { z-index: 1; line-height: 1; }
.panel .lbl b {
  display: block;
  font-size: 21px; font-weight: 600;
  letter-spacing: .3em; text-transform: uppercase;
  opacity: .85; margin-bottom: 4px;
}
.panel .lbl strong {
  display: block;
  font-family: var(--display);
  font-size: 32px; text-transform: uppercase; letter-spacing: .02em;
}
.panel .val {
  margin-left: auto; z-index: 1;
  font-family: var(--display);
  font-size: 34px; text-transform: uppercase;
  text-shadow: 0 3px 14px rgba(0, 0, 0, .6);
}

/* ============================================================
   BARRE RÉSEAUX — icône rouge + pseudo encadré
   ============================================================ */

.socials-title {
  font-family: var(--display);
  font-size: 40px; text-transform: uppercase;
  letter-spacing: .06em; text-align: center;
  margin-bottom: 26px;
}
.socials { display: flex; flex-direction: column; gap: 14px; align-items: center; }

.chip {
  display: flex; align-items: stretch;
  height: 74px; width: 560px;
  border: 3px solid var(--white);
  background: rgba(6, 2, 3, .5);
}
.chip .badge {
  flex: 0 0 74px;
  display: grid; place-items: center;
  background: var(--white);
}
.chip .badge svg { width: 40px; height: 40px; fill: var(--red-600); display: block; }
.chip .name {
  display: flex; align-items: center;
  padding-left: 22px;
  font-family: var(--display);
  font-size: 36px; text-transform: none; letter-spacing: .02em;
}

@media (prefers-reduced-motion: reduce) {
  .streak, .live .pip { animation: none; }
}

</style>
<style>
  .center.titles { top: 560px; }
  .display { font-size: 140px; }
  .kicker  { margin-bottom: 26px; }

  /* Compte à rebours — chiffres condensés + jauge à coins entaillés */
  .count { position: absolute; left: 0; right: 0; top: 900px; text-align: center; }
  .count .num {
    font-family: var(--display);
    font-size: 190px; line-height: .9;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 60px rgba(255, 60, 90, .6), 0 10px 40px rgba(0, 0, 0, .8);
  }
  .gauge {
    position: relative;
    width: 620px; height: 14px;
    margin: 34px auto 0;
    background: rgba(255, 255, 255, .12);
    --cut: 7px;
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .gauge i {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, var(--red-600), var(--hot));
    box-shadow: 0 0 26px rgba(255, 92, 116, .9);
    transition: width 1s linear;
  }

  .block { position: absolute; left: 0; right: 0; top: 1180px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="handle" data-p="name">ItsGokTV</div>
    <div class="live"><span class="pip"></span>LIVE</div>
  </div>

  <div class="center titles">
    <div class="kicker">Ça arrive</div>
    <div class="display">On commence</div>
  </div>

  <div class="count">
    <div class="num" id="num">10:00</div>
    <div class="gauge"><i id="fill" style="width:100%"></i></div>
  </div>

  <div class="block">
    <div class="socials-title">Restez connectés</div>
    <div class="socials">
      <div class="chip"><span class="badge" data-icon="twitch"></span><span class="name" data-p="twitch">ItsGokTV</span></div>
      <div class="chip"><span class="badge" data-icon="instagram"></span><span class="name" data-p="instagram">ItsGokTV</span></div>
    </div>
  </div>

<script>
/* ============================================================
   Socle commun aux overlays ItsGokTV
   - construit le fond animé (obliques rouges)
   - fournit les icônes réseaux et les icônes de panneaux
   - lit les paramètres passés dans l'URL
   ============================================================ */

const Q = new URLSearchParams(location.search);

/** Valeur d'un paramètre d'URL, avec repli. */
function param(key, fallback) {
  const v = Q.get(key);
  return (v === null || v === '') ? fallback : v;
}

/* ---------- Icônes (SVG inline, aucune requête réseau) ---------- */
const ICONS = {
  tiktok:    '<svg viewBox="0 0 24 24"><path d="M16.6 5.8a5 5 0 0 1-1.2-3.3h-3.3v13.2a2.8 2.8 0 1 1-2-2.7V9.6a6.1 6.1 0 1 0 5.3 6V9.1a8.3 8.3 0 0 0 4.8 1.5V7.3a5 5 0 0 1-3.6-1.5z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.9.07 3.3.15 4.8 1.7 5 5 .06 1.3.07 1.7.07 4.9s0 3.6-.07 4.9c-.15 3.3-1.7 4.8-5 5-1.3.06-1.7.07-4.9.07s-3.6 0-4.9-.07c-3.3-.15-4.8-1.7-5-5C2.07 15.6 2.06 15.2 2.06 12s0-3.6.07-4.9c.15-3.3 1.7-4.8 5-5C8.4 2.2 8.8 2.2 12 2.2zm0 4.9a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8zm0 8.1a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.1-8.3a1.15 1.15 0 1 0 0-2.3 1.15 1.15 0 0 0 0 2.3z"/></svg>',
  youtube:   '<svg viewBox="0 0 24 24"><path d="M23 7.5a3 3 0 0 0-2.1-2.1C19 4.9 12 4.9 12 4.9s-7 0-8.9.5A3 3 0 0 0 1 7.5C.5 9.4.5 12 .5 12s0 2.6.5 4.5a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-4.5.5-4.5s0-2.6-.5-4.5zM9.8 15.4V8.6l5.9 3.4-5.9 3.4z"/></svg>',
  twitch:    '<svg viewBox="0 0 24 24"><path d="M4.3 1.7 2 6.2v14.1h5v3h3.7l3-3h4.1L23 18V1.7H4.3zm16.8 15.4-3.4 3.4h-4.9l-3 3v-3H5V3.6h16.1v13.5zM17 7.1v6.4h-2V7.1h2zm-5.3 0v6.4h-2V7.1h2z"/></svg>',
  star:      '<svg viewBox="0 0 24 24"><path d="m12 2 3 6.6 7 .9-5.2 4.9 1.4 7L12 18l-6.2 3.4 1.4-7L2 9.5l7-.9L12 2z"/></svg>',
  heart:     '<svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.3-8.5-11A4.9 4.9 0 0 1 12 6.6 4.9 4.9 0 0 1 20.5 10c0 5.7-8.5 11-8.5 11z"/></svg>',
  dollar:    '<svg viewBox="0 0 24 24"><path d="M13 2v2.3c2.5.3 4.2 1.7 4.4 4h-2.7c-.2-1-1-1.7-2.6-1.7-1.6 0-2.6.7-2.6 1.8 0 1 .7 1.5 3 2 3.4.7 5.1 1.8 5.1 4.4 0 2.4-1.8 4-4.6 4.4V21h-2v-2.3c-2.8-.3-4.7-1.9-4.9-4.4h2.8c.2 1.2 1.2 2 3.1 2 1.8 0 2.8-.8 2.8-1.9 0-1-.6-1.6-3.1-2.1-3.4-.7-5-1.9-5-4.4 0-2.3 1.8-3.9 4.3-4.3V2h2z"/></svg>',
  diamond:   '<svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12 12 2z"/></svg>',
  chat:      '<svg viewBox="0 0 24 24"><path d="M21 4H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4v4l5-4h9a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/></svg>'
};

/* ---------- Fond animé ---------- */
/* Chaque oblique a sa largeur, sa position et son décalage d'animation :
   le motif ne se répète jamais à l'identique. */
const STREAKS = [
  { x: 4,  w: 210, t: 'dark', d: -6  },
  { x: 16, w: 46,  t: 'lite', d: -2  },
  { x: 22, w: 120, t: 'dark', d: -11 },
  { x: 33, w: 26,  t: 'lite', d: -14 },
  { x: 39, w: 300, t: 'dark', d: -4  },
  { x: 57, w: 70,  t: 'lite', d: -9  },
  { x: 64, w: 18,  t: 'lite', d: -17 },
  { x: 70, w: 180, t: 'dark', d: -1  },
  { x: 82, w: 40,  t: 'lite', d: -13 },
  { x: 90, w: 96,  t: 'dark', d: -7  }
];

function mountStage(target) {
  const host = target || document.body;
  const stage = document.createElement('div');
  stage.className = 'stage';

  const base = document.createElement('div');
  base.className = 'base';

  const wrap = document.createElement('div');
  wrap.className = 'streaks';
  for (const s of STREAKS) {
    const el = document.createElement('div');
    el.className = 'streak ' + s.t;
    el.style.left = s.x + '%';
    el.style.width = s.w + 'px';
    el.style.animationDelay = s.d + 's';
    wrap.appendChild(el);
  }

  const vig = document.createElement('div');
  vig.className = 'vignette';

  stage.append(base, wrap, vig);
  host.prepend(stage);
}

/* ---------- Application des paramètres d'URL ---------- */
/* Tout élément portant data-p="clef" reçoit la valeur du paramètre. */
function applyParams() {
  document.querySelectorAll('[data-p]').forEach(el => {
    const v = Q.get(el.dataset.p);
    if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = ICONS[el.dataset.icon] || '';
  });
  const accent = Q.get('accent');
  if (accent) {
    const hex = '#' + accent.replace('#', '');
    document.documentElement.style.setProperty('--red-500', hex);
    document.documentElement.style.setProperty('--red-600', hex);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  mountStage();
  applyParams();
});

</script>
<script>
  // v-debut.html?min=10 → durée du compte à rebours
  window.addEventListener('DOMContentLoaded', () => {
    const total = Math.max(1, parseInt(param('min', '10'), 10) * 60);
    const num = document.getElementById('num');
    const fill = document.getElementById('fill');
    let left = total;

    (function tick() {
      const m = Math.floor(left / 60), s = left % 60;
      num.textContent = m + ':' + String(s).padStart(2, '0');
      fill.style.width = (left / total * 100) + '%';
      if (left <= 0) { num.textContent = "C'EST PARTI"; num.style.fontSize = '108px'; return; }
      left--;
      setTimeout(tick, 1000);
    })();
  });
</script>
</body>
</html>
