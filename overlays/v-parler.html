<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Parler — ItsGokTV</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Coordonnées alignées sur la scène construite dans OBS :
     webcam en haut, gameplay en dessous. */
  :root {
    --cam-x:  20px; --cam-y:  380px; --cam-w: 839px; --cam-h: 472px;
    --game-x: 20px; --game-y: 900px; --game-w: 839px; --game-h: 472px;
  }

  .cam-frame {
    left: calc(var(--cam-x) - 5px); top: calc(var(--cam-y) - 5px);
    width: calc(var(--cam-w) + 10px); height: calc(var(--cam-h) + 10px);
  }
  .game-frame {
    left: calc(var(--game-x) - 5px); top: calc(var(--game-y) - 5px);
    width: calc(var(--game-w) + 10px); height: calc(var(--game-h) + 10px);
  }
  .cam-frame > .inner, .game-frame > .inner { background: transparent; }

  .claw.tl { left: calc(var(--cam-x) - 24px); top: calc(var(--cam-y) - 26px); }
  .claw.br {
    left: calc(var(--cam-x) + var(--cam-w) - 66px);
    top:  calc(var(--cam-y) + var(--cam-h) - 44px);
    transform: rotate(180deg);
  }

  .tab {
    position: absolute;
    display: flex; align-items: center; gap: 14px;
    height: 66px; padding: 0 24px;
    background: linear-gradient(105deg, var(--red-500), var(--red-700) 60%, var(--red-900));
    overflow: hidden;
    --cut: 14px;
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .tab::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(-24deg,
      transparent 0 22px, rgba(255,255,255,.08) 22px 29px, transparent 29px 58px);
  }
  .tab .lead {
    z-index: 1; font-size: 20px; font-weight: 600; letter-spacing: .28em;
    text-transform: uppercase; opacity: .85;
  }
  .tab .txt {
    z-index: 1; font-family: var(--display);
    font-size: 34px; text-transform: uppercase; letter-spacing: .04em;
    text-shadow: 0 3px 12px rgba(0, 0, 0, .55);
  }

  /* Sujet du moment — chevauche le bas de la webcam */
  .tab.topic { left: 20px; top: calc(var(--cam-y) + var(--cam-h) - 40px); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="handle" data-p="name">ItsGokTV</div>
    <div class="live"><span class="pip"></span>LIVE</div>
  </div>

  <div class="notch cam-frame"><div class="inner"></div></div>
  <div class="claw tl"><i></i><i></i><i></i></div>
  <div class="claw br"><i></i><i></i><i></i></div>
  <div class="tab topic">
    <span class="lead">On parle de</span>
    <span class="txt" data-p="sujet">Vos questions</span>
  </div>

  <div class="notch game-frame"><div class="inner"></div></div>

<script src="common.js"></script>
</body>
</html>
