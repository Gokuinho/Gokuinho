<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Parler — overlay vertical</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Webcam plein cadre, centrée haut — le visage domine.
     C'est le format qui retient le mieux sur TikTok. */
  :root {
    --slot-cam-x: 0px;    --slot-cam-y: 400px;
    --slot-cam-w: 1080px; --slot-cam-h: 608px;
  }
  .slot-cam {
    left: var(--slot-cam-x); top: var(--slot-cam-y);
    width: var(--slot-cam-w); height: var(--slot-cam-h);
    border-radius: 0; border-left: 0; border-right: 0;
  }
  .slot-cam::after { border-radius: 0; }

  .topic {
    position: absolute;
    left: 40px; top: 1060px;
    width: var(--safe-right);
    padding: 34px 40px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
  }
  .topic .label {
    font-size: 24px; font-weight: 800; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--accent-2);
    margin-bottom: 14px;
  }
  .topic .value {
    font-size: 52px; font-weight: 900;
    line-height: 1.1; letter-spacing: -0.03em;
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="aura"></div>
  <div class="grid"></div>

  <div class="header">
    <div class="pseudo" id="pseudo">itsgoktv</div>
    <div class="badge"><span class="dot"></span>LIVE</div>
  </div>

  <div class="slot slot-cam"></div>

  <div class="topic">
    <div class="label">On parle de</div>
    <div class="value" id="sujet">Vos questions</div>
  </div>

  <div class="socials">
    <div class="social"><span class="tag">Twitch</span><span id="tw">itsgoktv</span></div>
    <div class="social"><span class="tag">TikTok</span><span id="tk">@itsgoktv</span></div>
  </div>

  <div class="ui-fade"></div>

<script>
  const q = new URLSearchParams(location.search);
  const set = (id, key) => { const v = q.get(key); if (v) document.getElementById(id).textContent = v; };
  set('pseudo', 'name'); set('tw', 'twitch'); set('tk', 'tiktok'); set('sujet', 'sujet');
  const accent = q.get('accent');
  if (accent) document.documentElement.style.setProperty('--accent', '#' + accent.replace('#', ''));
</script>
</body>
</html>
