<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Parler — ItsGokTV</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Webcam plein cadre — le visage porte la scène. */
  :root { --cam-x: 40px; --cam-y: 420px; --cam-w: 840px; --cam-h: 472px; }

  .cam-frame {
    left: calc(var(--cam-x) - 5px); top: calc(var(--cam-y) - 5px);
    width: calc(var(--cam-w) + 10px); height: calc(var(--cam-h) + 10px);
  }
  .cam-frame > .inner { background: transparent; }

  .claw.tl { left: calc(var(--cam-x) - 24px); top: calc(var(--cam-y) - 26px); }
  .claw.br {
    left: calc(var(--cam-x) + var(--cam-w) - 66px);
    top:  calc(var(--cam-y) + var(--cam-h) - 44px);
    transform: rotate(180deg);
  }

  .topic {
    position: absolute;
    left: 40px; top: 940px; width: 840px;
    padding: 30px 34px;
    background: linear-gradient(105deg, var(--red-600) 0%, var(--red-700) 55%, var(--red-900) 100%);
    overflow: hidden;
    --cut: 20px;
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .topic::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(-24deg,
      transparent 0 26px, rgba(255,255,255,.07) 26px 34px, transparent 34px 70px);
  }
  .topic b {
    position: relative; display: block;
    font-size: 24px; font-weight: 600; letter-spacing: .32em;
    text-transform: uppercase; opacity: .85; margin-bottom: 8px;
  }
  .topic strong {
    position: relative; display: block;
    font-family: var(--display);
    font-size: 58px; text-transform: uppercase; letter-spacing: .02em;
  }

  .block { position: absolute; left: 0; right: 0; top: 1140px; }
  .block .socials { align-items: flex-start; padding-left: 40px; }
  .block .socials-title { text-align: left; padding-left: 40px; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="handle" data-p="name">ItsGokTV</div>
    <div class="live"><span class="pip"></span>LIVE</div>
  </div>

  <div class="notch cam-frame"><div class="inner"></div></div>
  <div class="claw tl"><i></i><i></i><i></i></div>
  <div class="claw br"><i></i><i></i><i></i></div>

  <div class="topic">
    <b>On parle de</b>
    <strong data-p="sujet">Vos questions</strong>
  </div>

  <div class="block">
    <div class="socials-title">Restez connectés</div>
    <div class="socials">
      <div class="chip"><span class="badge" data-icon="twitch"></span><span class="name" data-p="twitch">ItsGokTV</span></div>
      <div class="chip"><span class="badge" data-icon="instagram"></span><span class="name" data-p="instagram">ItsGokTV</span></div>
    </div>
  </div>

<script src="common.js"></script>
</body>
</html>
