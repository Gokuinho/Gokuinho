<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Jeu — ItsGokTV</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Coordonnées alignées sur les scènes construites dans OBS.
     Si tu déplaces une source, change ces valeurs : cadres, griffures
     et étiquettes suivent automatiquement. */
  :root {
    --game-x: 0px;   --game-y: 260px;  --game-w: 1080px; --game-h: 608px;
    --cam-x:  20px;  --cam-y:  900px;  --cam-w:  839px;  --cam-h:  472px;
  }

  /* Pas de pseudo en haut : le bandeau TikTok l'affiche déjà. */

  .game-frame {
    left: var(--game-x); top: calc(var(--game-y) - 5px);
    width: var(--game-w); height: calc(var(--game-h) + 10px);
    --cut: 0px;
  }
  .game-frame > .inner { --cut: 0px; background: transparent; }

  .cam-frame {
    left: calc(var(--cam-x) - 5px); top: calc(var(--cam-y) - 5px);
    width: calc(var(--cam-w) + 10px); height: calc(var(--cam-h) + 10px);
  }
  .cam-frame > .inner { background: transparent; }

  .claw.tl { left: calc(var(--cam-x) - 24px); top: calc(var(--cam-y) - 26px); }
  .claw.br {
    left: calc(var(--cam-x) + var(--cam-w) - 66px);
    top:  calc(var(--cam-y) + var(--cam-h) - 44px);
    transform: rotate(180deg);
  }

  /* Étiquettes qui chevauchent le bord bas des cadres — comme sur tes
     overlays Twitch, où le libellé mord sur la webcam. */
  .tab {
    position: absolute;
    display: flex; align-items: center; gap: 14px;
    height: 66px; padding: 0 24px;
    background: linear-gradient(105deg, var(--red-500), var(--red-700) 60%, var(--red-900));
    overflow: hidden;
    --cut: 14px;
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .tab::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(-24deg,
      transparent 0 22px, rgba(255,255,255,.08) 22px 29px, transparent 29px 58px);
  }
  .tab .ico { width: 30px; flex: 0 0 30px; z-index: 1; }
  .tab .ico svg { width: 100%; height: auto; fill: var(--white); display: block; }
  .tab .txt {
    z-index: 1;
    font-family: var(--display);
    font-size: 34px; text-transform: uppercase; letter-spacing: .04em;
    text-shadow: 0 3px 12px rgba(0, 0, 0, .55);
  }
  .tab .lead {
    z-index: 1;
    font-size: 20px; font-weight: 600; letter-spacing: .28em;
    text-transform: uppercase; opacity: .85;
  }

  /* Jeu en cours — sur le bord bas du gameplay */
  .tab.game { left: 20px; top: calc(var(--game-y) + var(--game-h) - 40px); }
  /* Dernier follower — sur le bord bas de la webcam */
  .tab.cam  { left: 20px; top: calc(var(--cam-y) + var(--cam-h) - 40px); }
</style>
</head>
<body>
  <div class="notch game-frame"><div class="inner"></div></div>
  <div class="tab game">
    <span class="ico" data-icon="twitch"></span>
    <span class="txt" data-p="jeu">FiveM</span>
  </div>

  <div class="notch cam-frame"><div class="inner"></div></div>
  <div class="claw tl"><i></i><i></i><i></i></div>
  <div class="claw br"><i></i><i></i><i></i></div>
  <div class="tab cam">
    <span class="ico" data-icon="heart"></span>
    <span class="lead">Dernier</span>
    <span class="txt" data-p="follower">greatace_xset</span>
  </div>

<script src="common.js"></script>
</body>
</html>
