<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Jeu — ItsGokTV</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Emplacements — doivent correspondre EXACTEMENT aux sources OBS.
     Le liseré est dessiné juste autour, il suit ces valeurs. */
  :root {
    --game-x: 0px;    --game-y: 270px;   --game-w: 1080px; --game-h: 608px;
    --cam-x:  40px;   --cam-y:  1020px;  --cam-w:  700px;  --cam-h:  394px;
  }

  /* Le bandeau TikTok occupe déjà le haut : pas de pseudo en doublon,
     le contenu démarre sous la zone réservée. */

  .game-frame {
    left: var(--game-x); top: calc(var(--game-y) - 5px);
    width: var(--game-w); height: calc(var(--game-h) + 10px);
    --cut: 0px;
  }
  .game-frame > .inner { --cut: 0px; background: transparent; }

  .cam-frame {
    left: calc(var(--cam-x) - 5px); top: calc(var(--cam-y) - 5px);
    width: calc(var(--cam-w) + 10px); height: calc(var(--cam-h) + 10px);
  }
  .cam-frame > .inner { background: transparent; }

  .claw.tl { left: calc(var(--cam-x) - 24px); top: calc(var(--cam-y) - 26px); }
  .claw.br {
    left: calc(var(--cam-x) + var(--cam-w) - 66px);
    top:  calc(var(--cam-y) + var(--cam-h) - 44px);
    transform: rotate(180deg);
  }

  /* Deux panneaux entre le gameplay et la webcam */
  .panels {
    position: absolute;
    left: 40px; top: 908px;
    width: 820px;
    flex-direction: row; gap: 20px;
  }
  .panels .panel { flex: 1; height: 88px; padding: 0 20px; gap: 14px; }
  .panels .panel .val { font-size: 30px; }

  /* Étiquette de jeu, collée sous la webcam à droite */
  .now {
    position: absolute;
    left: 776px; top: 1020px;
    width: 84px; height: 394px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--red-500), var(--red-700));
    --cut: 16px;
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
  }
  .now span {
    font-family: var(--display);
    font-size: 44px; text-transform: uppercase; letter-spacing: .1em;
    writing-mode: vertical-rl;
    text-shadow: 0 3px 14px rgba(0, 0, 0, .5);
  }
</style>
</head>
<body>
  <!-- Cadre du gameplay -->
  <div class="notch game-frame"><div class="inner"></div></div>

  <!-- Panneaux d'activité -->
  <div class="panels">
    <div class="panel">
      <span class="ico" data-icon="heart"></span>
      <span class="lbl"><b>Dernier</b><strong>Follower</strong></span>
      <span class="val" data-p="follower">—</span>
    </div>
    <div class="panel">
      <span class="ico" data-icon="star"></span>
      <span class="lbl"><b>Dernier</b><strong>Abonné</strong></span>
      <span class="val" data-p="abonne">—</span>
    </div>
  </div>

  <!-- Webcam -->
  <div class="notch cam-frame"><div class="inner"></div></div>
  <div class="claw tl"><i></i><i></i><i></i></div>
  <div class="claw br"><i></i><i></i><i></i></div>

  <!-- Bandeau vertical : le jeu en cours -->
  <div class="now"><span data-p="jeu">FiveM</span></div>

<script src="common.js"></script>
</body>
</html>
