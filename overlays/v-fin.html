<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Fin — ItsGokTV</title>
<link rel="stylesheet" href="theme.css">
<style>
  .center.titles { top: 620px; }
  .display { font-size: 150px; }
  .kicker  { margin-bottom: 26px; }
  .sub     { margin-top: 34px; }

  .block { position: absolute; left: 0; right: 0; top: 1120px; }

  /* Flèche vers le bouton « s'abonner » de TikTok, en haut à droite */
  .follow {
    position: absolute; right: 210px; top: 300px;
    display: flex; align-items: center; gap: 16px;
    padding: 16px 26px;
    background: linear-gradient(120deg, var(--red-500), var(--red-700));
    font-family: var(--display);
    font-size: 34px; text-transform: uppercase; letter-spacing: .04em;
    --cut: 14px;
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
    animation: nudge 2.6s ease-in-out infinite;
    will-change: transform;
  }
  .follow span { font-size: 44px; line-height: 1; }
  @keyframes nudge {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-14px); }
  }
  @media (prefers-reduced-motion: reduce) { .follow { animation: none; } }
</style>
</head>
<body>
  <div class="topbar">
    <div class="handle" data-p="name">ItsGokTV</div>
  </div>

  <div class="follow">Abonne-toi <span>↑</span></div>

  <div class="center titles">
    <div class="kicker">Le stream</div>
    <div class="display">Se termine</div>
    <div class="sub" data-p="sous">Merci d'avoir suivi — on remet ça très vite</div>
  </div>

  <div class="block">
    <div class="socials-title">Restez connectés</div>
    <div class="socials">
      <div class="chip"><span class="badge" data-icon="twitch"></span><span class="name" data-p="twitch">ItsGokTV</span></div>
      <div class="chip"><span class="badge" data-icon="instagram"></span><span class="name" data-p="instagram">ItsGokTV</span></div>
      <div class="chip"><span class="badge" data-icon="youtube"></span><span class="name" data-p="youtube">ItsGokTV</span></div>
    </div>
  </div>

<script src="common.js"></script>
</body>
</html>
