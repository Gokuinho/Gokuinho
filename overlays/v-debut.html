<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Début — écran d'attente</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* Anneau de progression autour du compte à rebours */
  .ring { position: absolute; left: 290px; top: 980px; width: 500px; height: 500px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255, 255, 255, 0.08); }
  .ring .fill {
    stroke: url(#g); stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 70%, transparent));
  }
  .ring .timer {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 130px; font-weight: 900; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="aura"></div>
  <div class="grid"></div>

  <div class="header">
    <div class="pseudo" id="pseudo">itsgoktv</div>
  </div>

  <div class="center">
    <div class="kicker">Bientôt en direct</div>
    <div class="title">ÇA<br>COMMENCE</div>
    <div class="subtitle" id="sous">Installe-toi, ça démarre dans un instant</div>
  </div>

  <div class="ring">
    <svg width="500" height="500">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="var(--accent)"/>
          <stop offset="100%" stop-color="var(--accent-2)"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="250" cy="250" r="225" fill="none" stroke-width="14"/>
      <circle class="fill"  cx="250" cy="250" r="225" fill="none" stroke-width="14"
              id="arc" stroke-dasharray="1413.7" stroke-dashoffset="0"/>
    </svg>
    <div class="timer" id="t">10:00</div>
  </div>

  <div class="ui-fade"></div>

<script>
  // v-debut.html?min=10  → compte à rebours de 10 minutes
  const q = new URLSearchParams(location.search);
  const set = (id, key) => { const v = q.get(key); if (v) document.getElementById(id).textContent = v; };
  set('pseudo', 'name'); set('sous', 'sous');
  const accent = q.get('accent');
  if (accent) document.documentElement.style.setProperty('--accent', '#' + accent.replace('#', ''));

  const total = Math.max(1, parseInt(q.get('min') || '10', 10) * 60);
  const CIRC  = 1413.7;
  const el    = document.getElementById('t');
  const arc   = document.getElementById('arc');
  let left    = total;

  function tick() {
    const m = Math.floor(left / 60), s = left % 60;
    el.textContent = m + ':' + String(s).padStart(2, '0');
    arc.setAttribute('stroke-dashoffset', CIRC * (1 - left / total));
    if (left <= 0) { el.textContent = "C'EST PARTI"; el.style.fontSize = '62px'; return; }
    left--;
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
