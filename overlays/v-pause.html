<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Pause — ItsGokTV</title>
<link rel="stylesheet" href="theme.css">
<style>
  .center.titles { top: 640px; }
  .display { font-size: 132px; }
  .kicker  { margin-bottom: 26px; }
  .sub     { margin-top: 34px; }

  .bar {
    position: absolute; left: 240px; top: 1040px;
    width: 600px; height: 10px;
    background: rgba(255, 255, 255, .12);
    overflow: hidden;
  }
  .bar::after {
    content: ""; position: absolute; inset: 0; width: 34%;
    background: linear-gradient(90deg, var(--red-500), var(--hot));
    box-shadow: 0 0 24px rgba(255, 92, 116, .8);
    animation: sweep 3.4s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes sweep {
    0%, 100% { transform: translateX(-12%); }
    50%      { transform: translateX(206%); }
  }

  .block { position: absolute; left: 0; right: 0; top: 1130px; }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; } }
</style>
</head>
<body>
  <div class="topbar">
    <div class="handle" data-p="name">ItsGokTV</div>
    <div class="live"><span class="pip"></span>LIVE</div>
  </div>

  <div class="center titles">
    <div class="kicker">Je reviens</div>
    <div class="display">Tout de suite</div>
    <div class="sub" data-p="sous">Reste dans le coin, ça reprend dans deux minutes</div>
  </div>

  <div class="bar"></div>

  <div class="block">
    <div class="socials-title">Restez connectés</div>
    <div class="socials">
      <div class="chip"><span class="badge" data-icon="twitch"></span><span class="name" data-p="twitch">ItsGokTV</span></div>
      <div class="chip"><span class="badge" data-icon="instagram"></span><span class="name" data-p="instagram">ItsGokTV</span></div>
      <div class="chip"><span class="badge" data-icon="youtube"></span><span class="name" data-p="youtube">ItsGokTV</span></div>
    </div>
  </div>

<script src="common.js"></script>
</body>
</html>
