<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>V-Pause — écran de pause</title>
<link rel="stylesheet" href="theme.css">
<style>
  .center { top: 660px; }
  /* Barre de respiration : signale que le live est toujours actif */
  .breath {
    position: absolute;
    left: 240px; top: 1160px;
    width: 600px; height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .breath::after {
    content: "";
    position: absolute; inset: 0;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    animation: sweep 3.2s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes sweep {
    0%, 100% { transform: translateX(-15%); }
    50%      { transform: translateX(165%); }
  }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="aura"></div>
  <div class="grid"></div>

  <div class="header">
    <div class="pseudo" id="pseudo">itsgoktv</div>
    <div class="badge"><span class="dot"></span>LIVE</div>
  </div>

  <div class="center">
    <div class="kicker">Petite coupure</div>
    <div class="title">PAUSE</div>
    <div class="subtitle" id="sous">Je reviens dans deux minutes — reste dans le coin</div>
  </div>

  <div class="breath"></div>

  <div class="socials">
    <div class="social"><span class="tag">Twitch</span><span id="tw">itsgoktv</span></div>
    <div class="social"><span class="tag">TikTok</span><span id="tk">@itsgoktv</span></div>
  </div>

  <div class="ui-fade"></div>

<script>
  const q = new URLSearchParams(location.search);
  const set = (id, key) => { const v = q.get(key); if (v) document.getElementById(id).textContent = v; };
  set('pseudo', 'name'); set('tw', 'twitch'); set('tk', 'tiktok'); set('sous', 'sous');
  const accent = q.get('accent');
  if (accent) document.documentElement.style.setProperty('--accent', '#' + accent.replace('#', ''));
</script>
</body>
</html>
